<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_dark" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="electric" x1="60" y1="44" x2="196" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="accent_blade" x1="100" y1="110" x2="180" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="aura" x="20" y="20" width="216" height="216" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="28" result="blur" />
    </filter>
  </defs>

  <!-- Premium rounded squircle background -->
  <rect width="256" height="256" rx="60" fill="url(#bg_dark)" />
  <rect x="1" y="1" width="254" height="254" rx="59" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Ambient electric aura -->
  <circle cx="128" cy="128" r="66" fill="#38BDF8" opacity="0.18" filter="url(#aura)" />

  <!-- The Velocity F -->
  <g transform="translate(6, -5)">
    <!-- Main Lightning Stem & Top Bar -->
    <path d="M 72 52 C 72 48.6863 74.6863 46 78 46 H 182 C 187.892 46 191.688 52.378 188.751 57.498 L 168.083 93.498 C 166.452 96.337 163.425 98.1 160.144 98.1 H 119.5 L 98.375 135 H 122 C 126.336 135 128.89 139.882 126.471 143.486 L 76.5 218 C 73.57 222.36 66.8 219.7 67.5 214.4 L 79.5 124 H 60 C 55.6 124 53.1 119 55.6 115.3 L 72 52 Z" fill="url(#electric)" />

    <!-- Center Crossbar Blade (Floating precision wing) -->
    <path d="M 128 108 H 168 C 172.5 108 175.8 112.5 174 116.6 L 161.4 145 C 160.1 148 157.1 150 153.8 150 H 112 L 128 108 Z" fill="url(#accent_blade)" opacity="0.95" />
