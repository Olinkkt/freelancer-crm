  #     POSTGRES_DB: crm_db
  #   volumes:
  #     - crm_db_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ['CMD-SHELL', 'pg_isready -U crm -d crm_db']
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  crm_data:
